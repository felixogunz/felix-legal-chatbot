
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b2447">
    <title>Reset Password | Felix Legal Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <a class="auth-brand" href="{{ url_for('login') }}">
                <span class="brand-mark" aria-hidden="true">F</span>
                <span>Felix Legal Chatbot</span>
            </a>

            <p class="auth-subtitle">Legal research assistant</p>

            <h1>Create a new password</h1>
            <p>Choose a strong password to secure your account.</p>

            {% if error %}
                <div class="auth-message error" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form
                method="POST"
                action="{{ url_for('reset_password', token=token) }}"
            >
                <div class="form-group">
                    <label for="password">New password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 12 characters"
                        autocomplete="new-password"
                        minlength="12"
                        maxlength="128"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm new password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Enter your new password again"
                        autocomplete="new-password"
                        minlength="12"
                        maxlength="128"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Reset password
                </button>
            </form>

            <p class="auth-footer">
                Remembered your password?
                <a href="{{ url_for('login') }}">Back to sign in</a>
            </p>
        </section>
    </main>
</body>
</html>
